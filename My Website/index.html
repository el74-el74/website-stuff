<!DOCTYPE html>

<html lang="en">
    <head>
        <title>About Me</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&display=swap" rel="stylesheet">

        <style>

            /* ==== background ==== */
            body {
                background-image: url("./background2.jpg");
                background-size: 500px;
                background-repeat: repeat-x;
                background-position: center;
                background-attachment: scroll;
                min-height: 100vh;
            }

            /* ==== main text allignment ==== */
            .main{
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 20px;
                gap: 5px;
            }

            /* ===== title ==== */
            h1 {
                height: 50px;
                line-height: 50px;
                max-width:500px;
                margin: 0;

                color:maroon;
                font-family: 'Crafty Girls', cursive;
                border:solid maroon;
                border-radius: 10px;
                background-color:rgb(236, 214, 214);
            }

            /* ==== intro text ==== */
            p {
                max-width: 500px;
                text-align: left;
                margin: 0;

                color:maroon;
                border:dashed maroon 2px;
                border-radius: 5px;
                background-color:rgb(236, 214, 214);
            }

        </style>
    </head>

    <body>
        <div class ="main">
            <h1>♡ welcome to my webpage ♡</h1>
            <p>Welcome to my page all about me! This is a collection of a bunch of different pages about my different interests! Have a look around and learn lots of stuff about my various obsessions over time :)</p>
        </div>
    </body>
    
</html>
